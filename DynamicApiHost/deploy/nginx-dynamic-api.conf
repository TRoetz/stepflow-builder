# External-facing dynamic API front door. Only /api/dynamic and /health are exposed;
# the engine (StepFunctionsApp, :5001) stays internal and is never routed publicly.
upstream stepflow_dynamic_host { server 127.0.0.1:5002; }

server {
    listen 80;
    server_name _;

    location = /health { proxy_pass http://stepflow_dynamic_host; }

    location /api/dynamic/ {
        proxy_pass http://stepflow_dynamic_host;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s; # long-running flows / data-exchange pipelines
    }
}
