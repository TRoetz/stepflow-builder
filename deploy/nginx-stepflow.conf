# StepFlow Builder — NGINX reverse proxy for the Dynamic API host.
# The .NET app binds one Kestrel port per workspace node ("DynamicApi" section in appsettings.json).
# Scoping is by backend TCP port: point each business unit / project domain at its upstream port.
# Same-host deployment assumed (127.0.0.1 upstreams); for cross-host set DynamicApi__ListenAddress=*.

upstream stepflow_mgmt { server 127.0.0.1:5001; }         # management: builder UI + all dynamic APIs
upstream stepflow_acme_website { server 127.0.0.1:5101; } # node "Acme UI/Website" — add one upstream per DynamicApi:Endpoints entry

# One server block per business unit / project domain, routed to that node's port.
server {
    listen 80;
    server_name acme-website.example.com;

    location /api/dynamic/ {
        proxy_pass http://stepflow_acme_website;   # no URI part → original path passed through
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;                   # flow executions can run long (default is 60s)
    }

    location = /api/health {
        proxy_pass http://stepflow_acme_website/api/health;
    }
}

# Default server: builder UI + management API.
server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://stepflow_mgmt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
}

# TLS: duplicate a server block with `listen 443 ssl;`, add ssl_certificate/ssl_certificate_key,
# and redirect the :80 block to https. Backend stays plain HTTP on localhost.
