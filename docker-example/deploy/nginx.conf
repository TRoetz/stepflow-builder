# StepFlow UI container: serves the built SPA and proxies API traffic to the backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flow engine REST API -> backend (no URI part, so the path is passed through).
    location /api/ {
        proxy_pass http://backend:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-running flow executions.
        proxy_read_timeout 300s;
    }

    # MCP endpoint (SSE) -> backend, streaming without buffering.
    location /mcp {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        # Keep the SSE channel open indefinitely.
        proxy_read_timeout 3600s;
    }

    # SPA fallback: unknown paths serve index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
