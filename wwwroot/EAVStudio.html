<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StepFlow | Data Dictionary Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid #334155; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .input-dark { background: #0f172a; border: 1px solid #334155; color: white; padding: 8px 12px; border-radius: 6px; outline: none; }
        .input-dark:focus { border-color: #3b82f6; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">
    <div id="app" class="flex w-full h-full">
        <!-- SIDEBAR: Entity List -->
        <aside class="w-72 glass-panel flex flex-col border-r border-slate-700 shadow-xl">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-bold text-blue-500">Data Dictionary</h1>
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest mt-1">EAV Meta-Builder</p>
                </div>
                <button @click="createNewEntity" class="w-8 h-8 rounded-full bg-blue-600 hover:bg-blue-500 flex items-center justify-center transition shadow-lg shadow-blue-500/20">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-2">
                <div v-for="entity in entities" :key="entity.entityName" 
                     @click="selectEntity(entity)"
                     :class="{'bg-blue-600/20 border-blue-500/50': selectedEntity?.entityName === entity.entityName, 'bg-slate-800/50 border-slate-700 hover:border-slate-500': selectedEntity?.entityName !== entity.entityName}"
                     class="w-full p-4 rounded-xl border cursor-pointer transition flex items-center justify-between group">
                    <div>
                        <div class="text-sm font-semibold" :class="selectedEntity?.entityName === entity.entityName ? 'text-blue-400' : 'text-slate-200'">{{ entity.entityName }}</div>
                        <div class="text-[10px] text-slate-500 truncate w-40">{{ entity.attributes.length }} Attributes</div>
                    </div>
                    <button @click.stop="deleteEntity(entity.entityName)" class="opacity-0 group-hover:opacity-100 p-2 text-slate-500 hover:text-red-400 transition">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </div>

            <div class="p-4 border-t border-slate-700 bg-slate-800/20">
                <h3 class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-3">Schema Templates</h3>
                <div class="grid grid-cols-1 gap-2">
                    <button @click="createTemplate('Input-Data-EAV')" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-[10px] text-blue-300 rounded border border-slate-700 transition flex items-center justify-center gap-2">
                        <i class="fas fa-file-import opacity-50"></i> Add Input-Data-EAV
                    </button>
                    <button @click="createTemplate('Result-Data-EAV')" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-[10px] text-emerald-300 rounded border border-slate-700 transition flex items-center justify-center gap-2">
                        <i class="fas fa-file-export opacity-50"></i> Add Result-Data-EAV
                    </button>
                </div>
            </div>

            <div class="p-4 border-t border-slate-700">
                <button @click="window.location.href='/builder.html'" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-bold transition flex items-center justify-center gap-2">
                    <i class="fas fa-arrow-left"></i> Back to Flow Builder
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT: Entity Editor -->
        <main class="flex-1 bg-slate-900 overflow-y-auto p-12">
            <div v-if="selectedEntity" class="max-w-4xl mx-auto space-y-8">
                <!-- Header Info -->
                <div class="flex justify-between items-start">
                    <div class="space-y-4 flex-1 mr-8">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">Entity Name</label>
                            <input v-model="selectedEntity.entityName" class="w-full text-3xl font-bold bg-transparent border-b border-transparent focus:border-blue-500 outline-none pb-2 transition" placeholder="CustomerProfile">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">Description</label>
                            <input v-model="selectedEntity.description" class="w-full bg-slate-800/50 border border-slate-700 rounded-lg p-3 text-sm text-slate-300 outline-none focus:border-blue-500" placeholder="A brief summary of this data contract...">
                        </div>
                    </div>
                    <button @click="saveEntity" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold transition flex items-center gap-2 shadow-lg shadow-blue-500/20">
                        <i class="fas fa-save"></i> Save Schema
                    </button>
                </div>

                <!-- Attribute List -->
                <div class="space-y-4">
                    <div class="flex justify-between items-center bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                        <h3 class="text-sm font-bold text-slate-200">Attribute Definitions</h3>
                        <button @click="addAttribute" class="text-xs font-bold text-blue-400 hover:text-blue-300 flex items-center gap-1">
                            <i class="fas fa-plus-circle"></i> Add Attribute
                        </button>
                    </div>

                    <div v-for="(attr, index) in selectedEntity.attributes" :key="index" class="glass-panel rounded-xl p-5 relative group border-l-4 border-l-blue-500 shadow-sm">
                        <button @click="removeAttribute(index)" class="absolute -right-2 -top-2 w-6 h-6 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs text-red-400 opacity-0 group-hover:opacity-100 transition hover:scale-110">
                            <i class="fas fa-times"></i>
                        </button>

                        <div class="grid grid-cols-12 gap-6 items-end">
                            <div class="col-span-3">
                                <label class="block text-[9px] font-bold text-slate-500 uppercase mb-2">Name</label>
                                <input v-model="attr.attributeName" class="input-dark w-full text-sm" placeholder="e.g., Age">
                            </div>
                            <div class="col-span-2">
                                <label class="block text-[9px] font-bold text-slate-500 uppercase mb-2">Type</label>
                                <select v-model="attr.dataType" class="input-dark w-full text-sm cursor-pointer">
                                    <option value="string">String</option>
                                    <option value="number">Number</option>
                                    <option value="boolean">Boolean</option>
                                    <option value="date">Date</option>
                                </select>
                            </div>
                            <div class="col-span-4">
                                <label class="block text-[9px] font-bold text-slate-500 uppercase mb-2">JSONPath Mapping (from payload)</label>
                                <div class="flex items-center">
                                    <span class="bg-slate-800 border border-r-0 border-slate-700 rounded-l px-3 py-2 text-xs text-slate-500 font-mono">$.</span>
                                    <input v-model="attr.jsonPathMapping" class="input-dark w-full rounded-l-none text-xs font-mono" placeholder="customer.id">
                                </div>
                            </div>
                            <div class="col-span-2 flex items-center justify-center pb-2">
                                <label class="flex items-center gap-2 cursor-pointer group/check">
                                    <input type="checkbox" v-model="attr.isRequired" class="w-4 h-4 rounded border-slate-700 bg-slate-800 text-blue-600 focus:ring-offset-slate-900 focus:ring-blue-500">
                                    <span class="text-[10px] font-bold text-slate-400 group-hover/check:text-slate-200 uppercase">Required</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div v-if="selectedEntity.attributes.length === 0" class="py-20 flex flex-col items-center text-slate-500 border-2 border-dashed border-slate-800 rounded-2xl">
                    <i class="fas fa-layer-group text-4xl mb-4 opacity-20"></i>
                    <p class="text-sm font-medium">No attributes defined. Start by adding one above.</p>
                </div>
            </div>

            <div v-else class="h-full flex flex-col items-center justify-center text-slate-600 space-y-4">
                <div class="w-20 h-20 rounded-full bg-slate-800/10 flex items-center justify-center border border-slate-800/20">
                    <i class="fas fa-database text-4xl opacity-20"></i>
                </div>
                <div class="text-center">
                    <h2 class="text-lg font-bold text-slate-400">Select or Create a Schema</h2>
                    <p class="text-sm">Build data contracts to make your flows type-safe and predictable.</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const entities = ref([]);
                const selectedEntity = ref(null);

                const fetchEntities = async () => {
                    const res = await fetch('/api/eav');
                    entities.value = await res.json();
                };

                const selectEntity = (entity) => {
                    selectedEntity.value = JSON.parse(JSON.stringify(entity));
                };

                const createNewEntity = () => {
                    selectedEntity.value = {
                        entityName: 'NewEntity_' + Date.now().toString().slice(-4),
                        description: '',
                        attributes: []
                    };
                };

                const addAttribute = () => {
                    selectedEntity.value.attributes.push({
                        attributeName: '',
                        dataType: 'string',
                        isRequired: false,
                        jsonPathMapping: ''
                    });
                };

                const removeAttribute = (index) => {
                    selectedEntity.value.attributes.splice(index, 1);
                };

                const saveEntity = async () => {
                    if (!selectedEntity.value.entityName) return alert('Entity Name is required');
                    
                    const res = await fetch('/api/eav', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(selectedEntity.value)
                    });

                    if (res.ok) {
                        alert('Schema saved successfully!');
                        await fetchEntities();
                        // Re-select to sync
                        const saved = entities.value.find(e => e.entityName === selectedEntity.value.entityName);
                        if (saved) selectEntity(saved);
                    } else {
                        alert('Failed to save schema.');
                    }
                };

                const deleteEntity = async (name) => {
                    if (!confirm(`Are you sure you want to delete ${name}?`)) return;
                    
                    const res = await fetch(`/api/eav/${name}`, { method: 'DELETE' });
                    if (res.ok) {
                        if (selectedEntity.value?.entityName === name) selectedEntity.value = null;
                        await fetchEntities();
                    }
                };

                onMounted(fetchEntities);

                const createTemplate = (name) => {
                    const existing = entities.value.find(e => e.entityName === name);
                    if (existing && !confirm(`${name} already exists. Do you want to overwrite it with the standard template?`)) return;

                    const templateMap = {
                        'Input-Data-EAV': {
                            entityName: 'Input-Data-EAV',
                            description: 'Standardized structure for passing input parameters between steps.',
                            attributes: [
                                { attributeName: 'RequestID', dataType: 'string', isRequired: true, jsonPathMapping: 'id' },
                                { attributeName: 'Payload', dataType: 'string', isRequired: false, jsonPathMapping: 'data' },
                                { attributeName: 'Source', dataType: 'string', isRequired: false, jsonPathMapping: 'source' },
                                { attributeName: 'Timestamp', dataType: 'string', isRequired: false, jsonPathMapping: 'ts' }
                            ]
                        },
                        'Result-Data-EAV': {
                            entityName: 'Result-Data-EAV',
                            description: 'Standardized structure for capturing execution results and errors.',
                            attributes: [
                                { attributeName: 'Status', dataType: 'string', isRequired: true, jsonPathMapping: 'status' },
                                { attributeName: 'ResponseCode', dataType: 'number', isRequired: false, jsonPathMapping: 'code' },
                                { attributeName: 'Data', dataType: 'string', isRequired: false, jsonPathMapping: 'body' },
                                { attributeName: 'ErrorMessage', dataType: 'string', isRequired: false, jsonPathMapping: 'error' }
                            ]
                        }
                    };

                    selectedEntity.value = JSON.parse(JSON.stringify(templateMap[name]));
                };

                return { entities, selectedEntity, selectEntity, createNewEntity, addAttribute, removeAttribute, saveEntity, deleteEntity, createTemplate };
            }
        }).mount('#app');
    </script>
</body>
</html>
