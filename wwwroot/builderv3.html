<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>StepFlow | Vue Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid #334155;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        .flow-line::before {
            content: '';
            position: absolute;
            top: -20px;
            bottom: -20px;
            left: 32px;
            width: 2px;
            background: #3b82f6;
            z-index: 0;
        }
    </style>
</head>

<body class="h-screen flex overflow-hidden">

    <div id="app" class="flex w-full h-full">

        <aside class="w-64 glass-panel flex flex-col z-10 shadow-xl">
            <div class="p-5 border-b border-slate-700">
                <h1 class="text-xl font-bold text-blue-500 tracking-wide">StepFlow</h1>
                <p class="text-xs text-slate-400 mt-1">Vertical Studio</p>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-6">
                <div>
                    <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-3">Integrations</h3>
                    <button @click="addStep('Task', 'ai://')"
                        class="w-full text-left bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-purple-500 rounded-lg p-3 mb-2 transition flex items-center gap-3 group">
                        <div
                            class="w-8 h-8 rounded bg-slate-900 flex items-center justify-center text-purple-400 group-hover:scale-110 transition">
                            <i class="fas fa-brain"></i></div>
                        <span class="text-sm font-medium">AI Agent</span>
                    </button>
                    <button @click="addStep('Task', 'rule://')"
                        class="w-full text-left bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-amber-500 rounded-lg p-3 mb-2 transition flex items-center gap-3 group">
                        <div
                            class="w-8 h-8 rounded bg-slate-900 flex items-center justify-center text-amber-400 group-hover:scale-110 transition">
                            <i class="fas fa-gavel"></i></div>
                        <span class="text-sm font-medium">Rule Engine</span>
                    </button>
                    <button @click="addStep('Task', 'http://')"
                        class="w-full text-left bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-blue-500 rounded-lg p-3 mb-2 transition flex items-center gap-3 group">
                        <div
                            class="w-8 h-8 rounded bg-slate-900 flex items-center justify-center text-blue-400 group-hover:scale-110 transition">
                            <i class="fas fa-globe"></i></div>
                        <span class="text-sm font-medium">HTTP API</span>
                    </button>
                    <button @click="addStep('Task', 'flow://')"
                        class="w-full text-left bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-emerald-500 rounded-lg p-3 transition flex items-center gap-3 group">
                        <div
                            class="w-8 h-8 rounded bg-slate-900 flex items-center justify-center text-emerald-400 group-hover:scale-110 transition">
                            <i class="fas fa-layer-group"></i></div>
                        <span class="text-sm font-medium">Sub-Flow</span>
                    </button>
                </div>

                <div>
                    <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-3">Core Logic</h3>
                    <button @click="addStep('Choice')"
                        class="w-full text-left bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-amber-500 rounded-lg p-3 mb-2 transition flex items-center gap-3 group">
                        <div
                            class="w-8 h-8 rounded bg-slate-900 flex items-center justify-center text-amber-500 group-hover:scale-110 transition">
                            <i class="fas fa-code-branch"></i></div>
                        <span class="text-sm font-medium">Choice Split</span>
                    </button>
                    <button @click="addStep('Wait')"
                        class="w-full text-left bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-400 rounded-lg p-3 mb-2 transition flex items-center gap-3 group">
                        <div
                            class="w-8 h-8 rounded bg-slate-900 flex items-center justify-center text-slate-400 group-hover:scale-110 transition">
                            <i class="fas fa-clock"></i></div>
                        <span class="text-sm font-medium">Wait Timer</span>
                    </button>
                    <button @click="addStep('Pass')"
                        class="w-full text-left bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-emerald-400 rounded-lg p-3 transition flex items-center gap-3 group">
                        <div
                            class="w-8 h-8 rounded bg-slate-900 flex items-center justify-center text-emerald-400 group-hover:scale-110 transition">
                            <i class="fas fa-arrow-right"></i></div>
                        <span class="text-sm font-medium">Pass / Inject</span>
                    </button>
                </div>
            </div>
        </aside>

        <main class="flex-1 bg-slate-900 overflow-y-auto p-10 relative flex flex-col items-center">
            <div class="w-full max-w-2xl relative">

                <div class="w-full flex mb-8 relative z-10 pl-4">
                    <div
                        class="w-12 h-12 rounded-full bg-emerald-500 border-4 border-slate-900 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                        <i class="fas fa-play text-white"></i>
                    </div>
                </div>

                <div class="relative w-full flow-line space-y-6">
                    <div v-for="(step, index) in steps" :key="step.id"
                        class="relative z-10 w-full glass-panel rounded-xl p-5 shadow-lg group">

                        <div class="absolute right-4 top-4 flex gap-2 opacity-0 group-hover:opacity-100 transition">
                            <button @click="moveStep(index, -1)" :disabled="index === 0"
                                class="text-slate-400 hover:text-white disabled:opacity-30"><i
                                    class="fas fa-chevron-up"></i></button>
                            <button @click="moveStep(index, 1)" :disabled="index === steps.length - 1"
                                class="text-slate-400 hover:text-white disabled:opacity-30"><i
                                    class="fas fa-chevron-down"></i></button>
                            <button @click="removeStep(index)" class="text-red-400 hover:text-red-300 ml-2"><i
                                    class="fas fa-trash"></i></button>
                        </div>

                        <div class="flex items-center gap-4 mb-4">
                            <div class="w-10 h-10 rounded-lg bg-slate-800 border border-slate-600 flex items-center justify-center text-lg"
                                :class="getIconColor(step.type)">
                                <i class="fas" :class="getIcon(step.type, step.resource)"></i>
                            </div>
                            <div>
                                <div class="text-[10px] font-bold tracking-widest uppercase text-slate-400">{{ step.type
                                    }}</div>
                                <input v-model="step.name"
                                    class="bg-transparent border-b border-transparent hover:border-slate-600 focus:border-blue-500 outline-none text-lg font-semibold text-white py-1 w-64 transition"
                                    placeholder="StepName">
                            </div>
                        </div>

                        <div v-if="step.type === 'Task'"
                            class="bg-slate-800/50 rounded-lg p-4 space-y-3 border border-slate-700/50">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Resource
                                    URI</label>
                                <input v-model="step.resource"
                                    class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-300 focus:border-blue-500 outline-none"
                                    placeholder="e.g., ai://...">
                            </div>
                            <div class="flex gap-4">
                                <div class="flex-1">
                                    <label
                                        class="block text-[10px] font-bold text-slate-500 uppercase mb-1">InputPath</label>
                                    <input v-model="step.inputPath"
                                        class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-300 focus:border-blue-500 outline-none">
                                </div>
                                <div class="flex-1">
                                    <label
                                        class="block text-[10px] font-bold text-slate-500 uppercase mb-1">ResultPath</label>
                                    <input v-model="step.resultPath"
                                        class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-300 focus:border-blue-500 outline-none">
                                </div>
                            </div>
                        </div>

                        <div v-if="step.type === 'Pass'"
                            class="bg-slate-800/50 rounded-lg p-4 space-y-3 border border-slate-700/50">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Inject Data
                                    (Result)</label>
                                <textarea v-model="step.resultData"
                                    class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-300 focus:border-blue-500 outline-none font-mono h-24"
                                    placeholder='{"status": "mocked", "value": 123}'></textarea>
                            </div>
                            <div>
                                <label
                                    class="block text-[10px] font-bold text-slate-500 uppercase mb-1">ResultPath</label>
                                <input v-model="step.resultPath"
                                    class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-300 focus:border-blue-500 outline-none"
                                    placeholder="$.injected">
                            </div>
                        </div>

                    </div>
                </div>

                <div class="w-full flex mt-8 relative z-10 pl-4">
                    <div
                        class="w-12 h-12 rounded-full bg-red-500 border-4 border-slate-900 flex items-center justify-center shadow-lg shadow-red-500/20">
                        <i class="fas fa-stop text-white"></i>
                    </div>
                </div>

            </div>
        </main>

        <aside class="w-1/3 glass-panel border-l border-slate-700 flex flex-col z-10">
            <div class="flex border-b border-slate-700 bg-slate-800/50">
                <button @click="activeTab = 'mermaid'"
                    :class="{'border-blue-500 text-blue-400': activeTab === 'mermaid', 'border-transparent text-slate-400': activeTab !== 'mermaid'}"
                    class="flex-1 py-4 text-xs font-bold uppercase tracking-wider border-b-2 hover:text-slate-200 transition">Flowchart</button>
                <button @click="activeTab = 'json'"
                    :class="{'border-blue-500 text-blue-400': activeTab === 'json', 'border-transparent text-slate-400': activeTab !== 'json'}"
                    class="flex-1 py-4 text-xs font-bold uppercase tracking-wider border-b-2 hover:text-slate-200 transition">ASL
                    JSON</button>
            </div>

            <div class="flex-1 overflow-y-auto p-6">
                <div v-show="activeTab === 'mermaid'" class="w-full flex justify-center">
                    <pre id="mermaid-container" class="mermaid">{{ mermaidCode }}</pre>
                </div>

                <div v-show="activeTab === 'json'">
                    <button @click="copyJson"
                        class="mb-4 text-xs bg-slate-800 hover:bg-slate-700 border border-slate-600 px-3 py-1.5 rounded text-slate-300 transition"><i
                            class="fas fa-copy mr-2"></i>Copy to Clipboard</button>
                    <pre
                        class="text-xs text-green-400 font-mono bg-slate-900 p-4 rounded-lg border border-slate-700 overflow-x-auto">{{ formattedJson }}</pre>
                </div>
            </div>
        </aside>

    </div>

    <script>
        const { createApp, ref, computed, watch, nextTick } = Vue;

        mermaid.initialize({ startOnLoad: false, theme: 'dark' });

        createApp({
            setup() {
                const activeTab = ref('json');
                const steps = ref([
                    { id: 'step_1', name: 'FormatData', type: 'Task', resource: 'rule://Formatter', inputPath: '$', resultPath: '$' },
                    { id: 'step_2', name: 'AnalyzeContent', type: 'Task', resource: 'ai://GeminiPro', inputPath: '$.content', resultPath: '$.analysis' }
                ]);

                const addStep = (type, resource = '') => {
                    const count = steps.value.length + 1;
                    steps.value.push({
                        id: 'step_' + Date.now(),
                        name: `${type}State_${count}`,
                        type: type,
                        resource: resource,
                        inputPath: '$',
                        resultPath: type === 'Task' || type === 'Pass' ? '$.output' : undefined,
                        resultData: type === 'Pass' ? '{\n  "mock": true\n}' : undefined
                    });
                };

                const removeStep = (index) => steps.value.splice(index, 1);

                const moveStep = (index, dir) => {
                    if (index + dir < 0 || index + dir >= steps.value.length) return;
                    const temp = steps.value[index];
                    steps.value[index] = steps.value[index + dir];
                    steps.value[index + dir] = temp;
                };

                // Dynamic Icons based on type & resource
                const getIcon = (type, res) => {
                    if (type === 'Task') {
                        if (res?.startsWith('ai://')) return 'fa-brain';
                        if (res?.startsWith('rule://')) return 'fa-gavel';
                        if (res?.startsWith('flow://')) return 'fa-layer-group';
                        return 'fa-globe';
                    }
                    return { Choice: 'fa-code-branch', Wait: 'fa-clock', Pass: 'fa-arrow-right' }[type] || 'fa-microchip';
                };

                const getIconColor = (type) => ({ Task: 'text-blue-400', Choice: 'text-amber-400', Wait: 'text-slate-400', Pass: 'text-emerald-400' }[type] || 'text-slate-400');

                // --- COMPUTED: Compile to ASL JSON ---
                const aslJson = computed(() => {
                    if (steps.value.length === 0) return { States: {} };

                    const definition = {
                        StartAt: steps.value[0].name,
                        States: {}
                    };

                    steps.value.forEach((step, index) => {
                        const stateDef = { Type: step.type };

                        if (step.type === 'Task') {
                            stateDef.Resource = step.resource;
                            if (step.inputPath) stateDef.InputPath = step.inputPath;
                            if (step.resultPath) stateDef.ResultPath = step.resultPath;
                        }

                        if (step.type === 'Pass') {
                            if (step.resultPath) stateDef.ResultPath = step.resultPath;
                            if (step.resultData) {
                                try {
                                    stateDef.Result = JSON.parse(step.resultData);
                                } catch (e) {
                                    stateDef.Result = step.resultData; // Fallback to string if not valid JSON
                                }
                            }
                        }

                        if (index === steps.value.length - 1) {
                            stateDef.End = true;
                        } else {
                            stateDef.Next = steps.value[index + 1].name;
                        }

                        definition.States[step.name] = stateDef;
                    });

                    return definition;
                });

                const formattedJson = computed(() => JSON.stringify(aslJson.value, null, 2));

                // --- COMPUTED: Compile to Mermaid ---
                const mermaidCode = computed(() => {
                    if (steps.value.length === 0) return "flowchart TD\n  START((START))";

                    let code = "flowchart TD\n";
                    code += `  START(((START))) --> ${steps.value[0].name}\n`;

                    steps.value.forEach((step, index) => {
                        const shape = step.type === 'Choice' ? `{{${step.name}}}` : `[${step.name}]`;
                        code += `  ${step.name}${shape}\n`;

                        if (index < steps.value.length - 1) {
                            code += `  ${step.name} --> ${steps.value[index + 1].name}\n`;
                        } else {
                            code += `  ${step.name} --> END(((END)))\n`;
                        }
                    });

                    code += `  classDef startEnd fill:#10b981,stroke:#047857,color:white;\n`;
                    code += `  class START,END startEnd;\n`;

                    return code;
                });

                watch(mermaidCode, async (newCode) => {
                    if (activeTab.value === 'mermaid') {
                        await nextTick();
                        const container = document.getElementById('mermaid-container');
                        if (container) {
                            container.removeAttribute('data-processed');
                            container.innerHTML = newCode;
                            try {
                                await mermaid.run({ nodes: [container] });
                            } catch (e) { }
                        }
                    }
                }, { immediate: true });

                watch(activeTab, (newTab) => {
                    if (newTab === 'mermaid') mermaidCode.value += ' ';
                });

                const copyJson = () => {
                    navigator.clipboard.writeText(formattedJson.value);
                    alert('ASL copied to clipboard!');
                };

                return { activeTab, steps, addStep, removeStep, moveStep, getIcon, getIconColor, formattedJson, mermaidCode, copyJson };
            }
        }).mount('#app');
    </script>
</body>

</html>
